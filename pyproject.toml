[project]
name = "peta"
description = "Human-friendly Python package metadata viewer"
license = "MIT"
readme = "README.md"
authors = [{ name = "Hasan Sezer Tasan", email = "hasansezertasan@gmail.com" }]
maintainers = [
  { name = "Hasan Sezer Tasan", email = "hasansezertasan@gmail.com" },
]
dynamic = ["version"]
keywords = [
  "packaging",
  "metadata",
  "pypi",
  "cli",
  "command-line",
  "python",
  "typer",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development",
  "Typing :: Typed",
  "Topic :: Utilities",
  "Topic :: Terminals",
]
requires-python = ">=3.14"
dependencies = ["typer", "rich", "httpx", "packaging"]


[project.urls]
changelog = "https://github.com/hasansezertasan/peta/blob/main/CHANGELOG.md"
documentation = "https://hasansezertasan.github.io/peta"
homepage = "https://github.com/hasansezertasan/peta"
issues = "https://github.com/hasansezertasan/peta/issues"
releasenotes = "https://github.com/hasansezertasan/peta/releases"
source = "https://github.com/hasansezertasan/peta.git"


[project.scripts]
peta = "peta.cli.app:run"


[dependency-groups]
dev = [
  "peta",
  "tox==4.61.2",
  "tox-uv==1.36.0",
  "debugpy==1.8.21",
  { include-group = "style" },
  { include-group = "test" },
]
style = [
  "actionlint-py==1.7.12.24",
  "basedpyright==1.39.10",
  "editorconfig-checker==3.11.1",
  "import-linter==2.14",
  "mypy==2.3.1",
  "pyrefly==1.2.0",
  "ruff==0.16.6",
  "slotscheck==0.20.1",
  "sphinx-lint==1.0.2",
  "taplo==0.9.3",
  "ty==0.0.78",
  "typos==1.50.1",
  "validate-pyproject[all]==0.26",
  "vulture==2.16",
  "zuban==0.9.3",
  # "google-yamlfmt",
  # "shellcheck-makefile>=1.27.3",
  # "shellcheck-py>=0.10.0.1",
  # "types-PyYAML",
  # "types-setuptools",
  # "types-ujson",
  # "yamlfix>=1.18.0",
  # "yamlfmt>=1.1.1",
  # "yamllint>=1.37.1",
]
test = [
  "coverage-enable-subprocess==1.0",
  "coverage[toml]==7.16.0",
  "pytest-mock==3.15.1",
  "pytest-rerunfailures==16.6.1",
  "pytest-xdist[psutil]==3.8.0",
  "pytest==9.1.1",
  "pytest-sugar",
  "pytest-asyncio>=0.23.0",
  "dirty-equals",
  "inline-snapshot",
]
docs = [
  "sphinx==9.1.0",
  "shibuya==2026.7.12",
  "sphinx-autobuild==2025.8.25", # 2025.x drops Python 3.10 (requires-python >= 3.11)
  "sphinx-copybutton==0.5.2",
  "sphinx-design==0.7.0",        # 0.7.0 drops Python 3.10 (requires-python >= 3.11)
  "sphinx-togglebutton==0.4.5",
  "sphinx-paramlinks==0.6.0",
  "auto-pytabs[sphinx]==0.5.0",
  "myst-parser==5.1.0",
  "sphinx-click==6.2.0",
]
tool = [
  "commitizen==4.18.0",
  # "marimo==0.15.2",
  # "inflection==0.5.1",
  # "copier==9.11.0",
]
prek = ["prek==0.5.2"]


[build-system]

requires = ["hatchling", "hatch-vcs"]

build-backend = "hatchling.build"


[tool.uv]
add-bounds = "exact"
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
]
package = true
trusted-publishing = "always"


[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"


[tool.hatch.build]
hooks.vcs.version-file = "src/peta/_version.py"


[tool.hatch.version.raw-options]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.hatch.metadata]
allow-direct-references = true


[tool.hatch.build.targets.sdist]
# The package uses a src layout, so the source tree lives under /src (not
# /peta); including /src ships the actual modules -- and, for
# C-extension projects, the .pyx/.pxd sources needed to compile from the sdist.
include = ["/README.md", "LICENSE", "/src", "/tests"]


[tool.commitizen]
# Commit-authoring and message linting only. release-please owns version
# bumping, git tagging, and CHANGELOG.md (see .github/release-please-config.json),
# so the bump/tag/changelog settings are intentionally omitted here to avoid two
# tools competing over the same tags and changelog file.
name = "cz_conventional_commits"

[tool.pytest.ini_options]
# addopts = "-rXs --strict-config --strict-markers"
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = [
  "smoke: fast import/entrypoint checks",
  "unit: pure logic, fully mocked, no I/O",
  "integration: real components wired, no external network",
  "e2e: full CLI via entry point; e2e-remote hits real PyPI (opt-in)",
]
testpaths = ["tests"]
xfail_strict = true


[tool.coverage.run]
branch = true
# Match `_version.py` wherever it resolves: `src/...` in editable dev installs and
# `.../site-packages/...` when tox/CI installs the built wheel or sdist. A
# `src/**`-only pattern silently misses the installed copy and reports it at 0%.
omit = ["*/_version.py"]
parallel = true
source_pkgs = ["peta", "tests"]


[tool.coverage.paths]
# Unify coverage data across environments. tox installs the built wheel/sdist into
# each env's site-packages, so the same source file is measured under a different
# `.tox/<env>/.../site-packages/peta` path per interpreter. Without
# remapping those back to the canonical `src/` tree, `coverage combine` keeps a
# separate copy per env and a version-gated line covered in one interpreter but not
# another is wrongly counted as missed — silently failing the `fail_under` gate.
# `tests` needs no remapping: it is never installed, so every environment measures
# it at the same repo-local path.
peta = ["src/peta", "*/site-packages/peta"]


[tool.coverage.report]
# Untestable code is excluded per site with `# pragma: no cover`, not with blanket
# patterns here: a regex matching a `def` line excludes the *whole function body*,
# so a pattern like `def main\(` would silently un-measure any future `main()`
# with real logic (and did mask the tested GUI/TUI entrypoints). Pragmas carry the
# exclusion decision next to the code it affects. See ADR-008.
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
fail_under = 99
# Patterns match both the `src/` (editable) and installed (`site-packages`)
# layouts (see [tool.coverage.run] omit).
omit = ["*/_version.py"]
show_missing = true
skip_covered = true


[tool.vulture]
# Framework-invoked handlers: Typer commands, FastAPI routes, FastStream
# lifecycle hooks, and the MCP tool dispatcher.
ignore_decorators = [
  "@app.command",
  "@app.get",
  "@app.after_startup",
  "@app.after_shutdown",
  "@server.call_tool",
]
# Public API surfaces vulture cannot see being used: ``main`` entry points are
# referenced only via pyproject scripts, ``model_config`` is consumed by
# pydantic-settings, ``logger`` is imported only by optional components, the MCP
# ``arguments`` parameter is mandated by the call_tool signature, and
# ``pytestmark`` is consumed by pytest at collection time.
ignore_names = [
  "CONFIG_FILE_PATH",
  "logger",
  "main",
  "model_config",
  # pytest markers, mock attributes, and external PyPI-schema TypedDict fields (accessed via string keys)
  "pytestmark",
  "return_value",
  "side_effect",
  "author_email",
  "home_page",
  "license_expression",
  "requires_dist",
  "requires_python",
  # OSV-schema TypedDict fields read via string keys in core/osv.py
  "vulns",
  "details",
  "events",
  "ranges",
  "score",
  # pypistats.org/libraries.io-schema TypedDict fields read via string keys
  # in core/stats.py
  "last_month",
  "dependents_count",
]
min_confidence = 60
paths = ["src", "tests"]


[tool.typos.default.extend-words]
# `certifi` is a real PyPI package name (the CA-bundle package), not a typo of
# "certify"/"certified"; it shows up in the PyPI-schema example payload under
# docs/superpowers/plans.
certifi = "certifi"


[tool.slotscheck]
strict-imports = false


[tool.importlinter]
root_package = "peta"


[[tool.importlinter.contracts]]
name = "Layered architecture with independent components"
type = "layers"
# Layers are listed high -> low: a layer may import lower layers but never a
# higher one. `cli` is the top layer (commands + rendering, including
# `peta.cli.output`), sitting above `core` (data + I/O).
layers = ["peta.cli", "peta.core"]


[tool.ruff]
# SDD plan/spec docs under docs/superpowers embed the package source as fenced
# code blocks; they are historical artifacts (also excluded from the Sphinx
# build) and must not be lint-fixed or reformatted as if they were live source.
extend-exclude = ["docs/superpowers"]
fix = true
output-format = "full"
preview = true
show-fixes = true
src = ["src", "tests"]
target-version = "py314"
unsafe-fixes = true


[tool.ruff.analyze]
detect-string-imports = true
preview = true


[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true
skip-magic-trailing-comma = true


[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["missing-trailing-comma", "CPY", "FIX", "TD"]
preview = true
select = ["ALL"]

[tool.ruff.lint.isort]
combine-as-imports = true
# skip-magic-trailing-comma = true
split-on-trailing-comma = false

[tool.ruff.lint.flake8-copyright]
author = "Hasan Sezer Tasan <hasansezertasan@gmail.com>"


[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"


[tool.ruff.lint.mccabe]
max-complexity = 5


[tool.ruff.lint.pylint]
# Typer command handlers accumulate one boolean flag per feature (--local,
# --remote, --no-osv, --no-stats, ...); the default of 5 is too tight for
# that pattern. `compare(ctx, a, b, use_json, local, remote, no_osv, no_stats)`
# needs 9 (two package arguments plus the legacy --json alias and --format).
max-args = 9


[tool.ruff.lint.pycodestyle]
ignore-overlong-task-comments = true


[tool.ruff.lint.pydocstyle]
convention = "pep257"


[tool.ruff.lint.per-file-ignores]
# Recursive glob so nested test packages (tests/cli, tests/gui, ...) are covered.
# Tests legitimately use asserts/magic values, reach into package internals,
# don't need docstrings on test classes/functions/fixtures nor return-value
# documentation, use self-less test methods (pytest style), and import lazily
# inside a test to exercise import-time behavior. They are implicit namespace
# packages (no __init__.py required).
"tests/**/*.py" = [
  "assert",
  "magic-value-comparison",
  "import-private-name",
  "docstring-missing-returns",
  "implicit-namespace-package",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "undocumented-magic-method",
  "undocumented-public-init",
  "no-self-use",
  "import-outside-top-level",
]
# The Sphinx config is a standalone module, not part of an importable package.
"docs/conf.py" = ["implicit-namespace-package"]
# Typer uses Option()/Argument() defaults and passes bool flag defaults positionally.
"src/peta/cli/**/*.py" = [
  "function-call-in-default-argument",
  "boolean-type-hint-positional-argument",
  "boolean-default-value-positional-argument",
  "boolean-positional-value-in-call",
]
# dataclass fields `id`/`license` shadow builtins by design.
"src/peta/core/models.py" = ["builtin-attribute-shadowing"]


[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true


[tool.ruff.lint.ruff]
parenthesize-tuple-in-subscript = true


[tool.mypy]
files = ["src"]
pretty = true
python_version = "3.14"
strict = true


[tool.basedpyright]
exclude = [".venv"]
include = ["src/peta"]
pythonVersion = "3.14"
venv = ".venv"
# venvPath is the directory *containing* the venv, not the venv itself; ".venv"
# here would make basedpyright look for ".venv/.venv". Use "." so both the venv
# and basedpyright's strict ruleset resolve the project's installed deps.
venvPath = "."


[tool.ty.src]
include = ["src", "tests"]
respect-ignore-files = false


[tool.ty.environment]
python-version = "3.14"


[tool.ty.terminal]
error-on-warning = true


[tool.pyrefly]
python-version = "3.14"
project-includes = ["src"]

[tool.tox]
# The ``worker`` env is intentionally omitted: it starts a broker-bound process
# and would hang/fail under ``tox run`` in CI (where no broker is available).
# The worker is covered by its pytest TestBroker suite; run it on demand with
# ``tox -e worker`` when a broker is up (e.g. inside the devcontainer).
env_list = ["style", "cli", "3.14"]
requires = ["tox>=4"]


[tool.tox.env_run_base]
commands = [
  [
    "coverage",
    "run",
    "--module",
    "pytest",
    "-v",
    "--tb=short",
    "--basetemp={env_tmp_dir}",
    { replace = "posargs", default = [
    ], extend = true },
  ],
]
constrain_package_deps = true
dependency_groups = ["test"]
description = "Run the tests under {base_python}"
env_tmp_dir = "{toxworkdir}/tmp/{envname}"
# Arms coverage-enable-subprocess so xdist/subprocess workers are measured too;
# `coverage run` plus `parallel = true` writes per-env data files that the CI
# `coverage combine` step merges.
set_env = { COVERAGE_PROCESS_START = "{tox_root}/pyproject.toml" }

package = "wheel"

runner = "uv-venv-runner"
use_frozen_constraints = true
wheel_build_env = ".pkg"


[tool.tox.env.style]
base_python = ["3.14"]
commands = [
  ["ruff", "check", "--no-fix"],
  ["ruff", "format", "--check", "--diff"],
  ["mypy", "--python-version", "3.14"],
  ["basedpyright"],
  ["ty", "check"],
  ["pyrefly", "check"],
  ["zuban", "check", "src"],
  ["vulture"],
  ["python", "-m", "slotscheck", "src"],
  ["lint-imports"],
  ["taplo", "lint", "*.toml"],
  # NOTE: kept in fix mode (not `--check`) because the rendered TOML is not yet
  # guaranteed taplo-formatted across every component combination. The `*.toml`
  # glob is non-recursive, so it scopes taplo to this project's own root TOML
  # (pyproject/prek/mise) without walking vendored `.tox`/`.venv`/site-packages
  # trees — no `.taplo.toml` exclude config needed. Making this a strict
  # `--check` gate is a follow-up that first requires the generated
  # pyproject/prek to be clean.
  ["taplo", "format", "*.toml"],
  ["validate-pyproject", "pyproject.toml"],
  ["typos", "--diff"],
  ["actionlint"],
  ["ec"],
  ["sphinx-lint", "docs"],
  # ["yamlfmt", "."],
]
# `test` is included so the type checkers that scope tests (e.g. ty) can
# resolve pytest and other test-only imports.
dependency_groups = ["style", "test"]
description = "Run Checkers, Linters and Formatters"
runner = "uv-venv-runner"


[tool.tox.env.prek]
commands = [["prek", "run", "--all-files"]]
dependency_groups = ["prek"]
description = "Run prek hooks"
runner = "uv-venv-runner"


[tool.tox.env.docs-build]
commands = [["sphinx-build", "-b", "html", "docs", "docs/_build/html"]]
dependency_groups = ["docs"]
description = "Build Docs"
runner = "uv-venv-runner"


[tool.tox.env.docs-server]
commands = [["sphinx-autobuild", "docs", "docs/_build/html"]]
dependency_groups = ["docs"]
description = "Start the live-reloading docs server"
runner = "uv-venv-runner"


[tool.tox.env.docs-linkcheck]
# On-demand link checker. Also run weekly (non-blocking) by docs-linkcheck.yml.
# Hits the network, so it is deliberately not part of the `style` env or PR CI.
commands = [
  [
    "sphinx-build",
    "-b",
    "linkcheck",
    "docs",
    "docs/_build/linkcheck",
  ],
]
dependency_groups = ["docs"]
description = "Check documentation for broken links"
runner = "uv-venv-runner"

[tool.tox.env.cli]
commands = [
  [
    "peta",
    { replace = "posargs", default = [
      "--version",
    ], extend = true },
  ],
]
description = "Run the CLI application."
runner = "uv-venv-runner"
