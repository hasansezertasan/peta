---
name: Copilot setup steps
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
permissions: {}
jobs:
  # GitHub Copilot coding agent requires this exact job ID.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install mise tools
        # uv must be on PATH first: mise's pipx backend then installs cobo via
        # uv, which provisions the Python >=3.14 cobo requires instead of the
        # runner's older system interpreter (same order as ci.yml's hooks job).
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492  # v5.0.1
      - name: Sync dependencies
        run: uv sync
