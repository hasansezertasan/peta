  coverage-core:
    name: Coverage gate (core)
    needs: [changes, test-core]
    if: >-
      ${{ !cancelled() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Download core coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: coverage-core-*
          merge-multiple: true
      - name: Combine and gate the core subtree
        # `--locked --only-group test` pins the SAME coverage version that produced
        # the `.coverage.*` data files (no unpinned drift), without building the
        # project. `relative_files` (pyproject) lets cross-runner paths merge.
        run: |
          uv run --locked --only-group test coverage combine
          uv run --locked --only-group test coverage report --show-missing --omit="*/_version.py,*/peta/cli/*,*/tests/cli/*" --fail-under=99

  coverage-cli:
